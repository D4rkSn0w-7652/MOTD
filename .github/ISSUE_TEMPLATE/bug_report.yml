name: Bug report
description: Something does not work as described
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. The more of the fields below
        you fill in, the faster it can be reproduced and fixed.

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: Shown by /motd, e.g. 1.3-hotfix
      placeholder: "1.3-hotfix"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Paper
        - Purpur
        - Folia
        - Spigot
        - Bukkit
        - Velocity
        - BungeeCord
        - Waterfall
        - Sponge
    validations:
      required: true

  - type: input
    id: server-version
    attributes:
      label: Server version
      description: Output of /version, or the exact build you are running
      placeholder: "git-Paper-132 (MC: 1.21.11)"
    validations:
      required: true

  - type: input
    id: client-version
    attributes:
      label: Client version
      description: Only relevant for sprite problems. Sprites need MC 1.21.9 or newer.
      placeholder: "1.21.11"
    validations:
      required: false

  - type: textarea
    id: what-happens
    attributes:
      label: What happens
      description: What do you see, and what did you expect instead? A screenshot of the server list helps a lot.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Set ... in settings.yml
        2. /motd reload
        3. Look at the server list
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: settings.yml
      description: The relevant part, or the whole file. Secrets are not needed here.
      render: yaml
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console output
      description: >
        Warnings and stack traces from startup and from the moment it goes wrong.
        Set debug to true in settings.yml and reload before copying, that adds
        the lines starting with "Debug:".
      render: text
    validations:
      required: false
